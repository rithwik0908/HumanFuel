# So Pedestrian study profile. Overrides default_config.yml. Contains study-specific paths + metadata.
# The generic engine reads target_1/2/3; target_config.yml maps them to triview/dashboard/ipad.

extends: "../../config/default_config.yml"
target_config: "target_config.yml"
metadata_mapping: "metadata_mapping.yml"
participant_status_mapping: "participant_status_mapping.yml"

study:
  id: so_pedestrian
  display_name: "So Pedestrian (Project Aria rig calibration)"
  description: "Locate the triview->dashboard->iPad rig-calibration interval per PID/trial."

input:
  roots:
    - "E:/rithwikS2026"
    - "E:/rithwikS2026/eye tracking"
  recursive: true
  accepted_file_patterns: ["general_eye_gaze.csv", "*general_eye_gaze.csv"]
  duplicate_policy: exclude_all_and_flag

participants:
  discovery_mode: requested_plus_discovered
  include: ["1-37"]
  exclude: []

trials:
  expected_indices: [0, 1, 2, 3, 4]

# calibration_search / target_blocks / window_quality / cluster_qc inherit the exact legacy baseline
# from default_config.yml (search 0..35, window 15s, step 0.5s, three 5s chunks, score 4/80/25).

metadata:
  enabled: true
  source_priority: [online, local, cached]
  online:
    document_id: "1KYk1YAlqJJZEtW-ka8xDA1_3aErYXfMnM6ODO0yoMQE"
    preferred_gid: "2041175138"
    url: "https://docs.google.com/spreadsheets/d/1KYk1YAlqJJZEtW-ka8xDA1_3aErYXfMnM6ODO0yoMQE/edit"
  local: "E:/rithwikS2026/Participant Tracker-So Pedestrian.xlsx"

outputs:
  root: "E:/rithwikS2026/aria_rig_calibration_results_python"
  run_label: "so_pedestrian_PID1_to_PID37"

legacy_comparison:
  # for Phase 14 reproduction validation (read-only)
  reference_outputs:
    - "E:/rithwikS2026/rig_calibration_analysis_outputs/calibration_window_detection.csv"
    - "E:/rithwikS2026/rig_calibration_analysis_outputs_PID7_to_PID19/calibration_window_detection.csv"
