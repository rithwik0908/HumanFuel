# Maps Participant Tracker columns -> the de-identified fields retained by the toolkit. Header matching
# is case-insensitive and punctuation-insensitive (so "Williams' Sequence" matches). Only the
# configured de-identified fields are retained in toolkit outputs; a forbidden-column guard aborts any
# export that would include a personal column (see forbidden_tokens).
metadata_mapping:
  participant_id_column: "PID"
  sequence_column: "Williams' Sequence"
  status_column: "Status"
  trial_lod_columns:
    0: "Trial 1"
    1: "Trial 2"
    2: "Trial 3"
    3: "Trial 4"
    4: "Trial 5"
  forbidden_tokens: ["name","email","phone","claim","serial","payment","gift","note","address","pronoun"]
