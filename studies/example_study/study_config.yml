# Example study profile demonstrating reusability for a DIFFERENT Aria study.
# Different input root, different target names/order, metadata disabled. No R/ edits needed.
extends: "../../config/default_config.yml"
target_config: "target_config.yml"
metadata_mapping: "metadata_mapping.yml"

study:
  id: example_study
  display_name: "Example Aria calibration study"
  description: "Template: two-target calibration (screen_left -> screen_right), metadata disabled."

input:
  roots: ["E:/some_other_project/aria_data"]     # <-- change to your data root
  recursive: true

participants:
  discovery_mode: discovered_only
  include: []

trials:
  expected_indices: [0, 1, 2]

# This example uses a 2-target calibration. NOTE: the validated legacy baseline assumes exactly THREE
# fixed-duration blocks; changing target count is a documented generalization beyond that baseline.
target_blocks:
  expected_count: 2

metadata:
  enabled: false

outputs:
  root: "E:/some_other_project/aria_rig_calibration_results"
  run_label: "example_study"
