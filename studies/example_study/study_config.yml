# Example study profile demonstrating reusability for a DIFFERENT three-target Aria study.
# Copy to study_config.local.yml and set ARIA_DATA_ROOT / ARIA_OUTPUT_ROOT (or use CLI overrides).
#
# NOTE: the validated method uses three equal-duration target blocks. This template keeps three
# targets so it runs against the same engine; see examples/new_study_setup.md for the target-count
# discussion.
extends: "../../config/default_config.yml"
target_config: "target_config.yml"
metadata_mapping: "metadata_mapping.yml"

study:
  id: example_study
  display_name: "Example Aria calibration study"
  description: "Template: three ordered calibration targets, metadata disabled."

input:
  roots:
    - "${ARIA_DATA_ROOT}"

participants:
  discovery_mode: discovered_only
  include: []

trials:
  expected_indices: [0, 1, 2]

target_blocks:
  expected_count: 3

metadata:
  enabled: false

outputs:
  root: "${ARIA_OUTPUT_ROOT}"
  run_label: "example_study"
